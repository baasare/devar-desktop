name: Desktop checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the Swift app
        run: swift build -c release
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "devar-engine>=0.1.1,<0.2.0"
      - name: Test the desktop bridge
        run: python -m unittest discover -s tests -v
      - name: Validate packaging scripts
        run: for script in scripts/*.sh; do sh -n "$script"; done

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install bridge dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "devar-engine>=0.1.1,<0.2.0"
      - name: Test shared speech and suggestion bridge
        run: python -m unittest discover -s tests -v
      - name: Build Windows x64 app and speech helper
        shell: pwsh
        run: ./windows/build.ps1
