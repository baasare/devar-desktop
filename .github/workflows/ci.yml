name: Desktop checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the Swift app
        run: swift build -c release
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "devar-engine[embedding]>=0.2.0,<0.3.0"
      - name: Test the desktop bridge
        run: python -m unittest discover -s tests -v
      - name: Validate packaging scripts
        run: for script in scripts/*.sh; do sh -n "$script"; done
